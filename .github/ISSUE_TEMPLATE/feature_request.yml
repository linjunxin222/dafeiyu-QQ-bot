name: Feature request
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明使用场景，不要提交真实密钥、QQ 号或私人数据。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么做
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 内容里没有密钥、QQ 号、密码、聊天记录或私人音频
          required: true
