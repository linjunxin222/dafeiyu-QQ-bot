<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 小号登录</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #ffffff; color: #111827; }
  body { font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 28px; }
  .title { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 24px; box-shadow: 0 18px 50px rgba(17, 24, 39, .12); }
  #qr { display: block; width: min(60vh, 460px); height: min(60vh, 460px); image-rendering: pixelated; }
  .note { font-size: 15px; color: #4b5563; text-align: center; line-height: 1.8; }
  .badge { display: inline-block; padding: 6px 12px; border-radius: 999px; background: #ecfdf5; color: #047857; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="title">QQ 小号扫码登录</div>
    <div class="card"><img id="qr" alt="QQ 登录二维码"></div>
    <div class="note">
      <span class="badge" id="state">二维码自动刷新中</span><br>
      请用<b>小号</b>手机 QQ 扫描上方二维码<br>
      登录完成后此页面可以关闭
    </div>
  </main>
<script>
  const base = "NapCat/NapCat.52230.Shell/versions/9.9.33-52230/resources/app/napcat/cache/qrcode.png";
  const img = document.getElementById("qr");
  const state = document.getElementById("state");
  let loadedOnce = false;
  function refresh() {
    img.src = base + "?t=" + Date.now();
  }
  img.addEventListener("load", () => {
    state.textContent = "二维码已加载 · 自动刷新";
    loadedOnce = true;
  });
  img.addEventListener("error", () => {
    if (!loadedOnce) state.textContent = "二维码生成中，请稍候…";
  });
  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>
